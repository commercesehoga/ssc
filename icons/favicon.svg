<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description><dc:creator>RealFaviconGenerator</dc:creator><dc:source>https://realfavicongenerator.net</dc:source></rdf:Description></rdf:RDF></metadata><defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6F5FF"></stop>
      <stop offset="100%" stop-color="#DDE3FF"></stop>
    </linearGradient>

    <!-- Glass Overlay Gradient -->
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"></stop>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1"></stop>
    </linearGradient>

    <!-- Lightning Gradient -->
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7C6FF0"></stop>
      <stop offset="100%" stop-color="#4F46E5"></stop>
    </linearGradient>

    <!-- Blur for Glass -->
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"></feGaussianBlur>
    </filter>

    <!-- Soft Inner Shadow -->
    <filter id="innerShadow">
      <feOffset dx="0" dy="2"></feOffset>
      <feGaussianBlur stdDeviation="3" result="offset-blur"></feGaussianBlur>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"></feComposite>
      <feFlood flood-color="#000" flood-opacity="0.08"></feFlood>
      <feComposite operator="in" in2="inverse"></feComposite>
      <feComposite operator="over" in2="SourceGraphic"></feComposite>
    </filter>

    <!-- Outer Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="coloredBlur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>

  </defs><rect width="64" height="64" rx="18" fill="url(#bg)"></rect><rect width="64" height="64" rx="18" fill="url(#glass)" filter="url(#blur)" opacity="0.6"></rect><path d="M0 0 H64 V22 Q32 32 0 22 Z" fill="white" opacity="0.25"></path><circle cx="32" cy="32" r="22" fill="white" opacity="0.15" stroke="white" stroke-opacity="0.25"></circle><circle cx="32" cy="32" r="18" fill="#5B4EE8" opacity="0.08"></circle><path d="M37 8 L17 34 H29 L24 56 L47 28 H34 Z" fill="url(#bolt)" filter="url(#innerShadow)"></path><path d="M37 8 L17 34 H29 L24 56 L47 28 H34 Z" fill="url(#bolt)" opacity="0.3" filter="url(#glow)"></path></svg>