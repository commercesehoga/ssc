<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ssc | Coming Soon</title>
    <style>
/* RESET */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;

    /* Soft iOS gradient background */
    background: radial-gradient(circle at 20% 20%, #eef2ff, transparent 40%),
                radial-gradient(circle at 80% 80%, #e0e7ff, transparent 40%),
                linear-gradient(135deg, #f8fafc, #eef2ff);
}

/* GLASS CARD */
.card {
    max-width: 600px;
    width: 100%;

    background: rgba(255, 255, 255, 0.55);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    border-radius: 32px;
    padding: 3.5rem 2.5rem;
    text-align: center;

    border: 1px solid rgba(255, 255, 255, 0.4);

    box-shadow:
        0 10px 30px rgba(0,0,0,0.08),
        inset 0 1px 1px rgba(255,255,255,0.6);

    position: relative;
    overflow: hidden;
}

/* iOS LIGHT REFLECTION */
.card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 40%;

    background: linear-gradient(
        to bottom,
        rgba(255,255,255,0.6),
        rgba(255,255,255,0.05)
    );

    pointer-events: none;
}

/* ICON (GLASS STYLE) */
.icon {
    width: 80px;
    height: 80px;
    margin: 0 auto 1.5rem;

    border-radius: 24px;

    background: rgba(255,255,255,0.35);
    backdrop-filter: blur(12px);

    border: 1px solid rgba(255,255,255,0.5);

    display: flex;
    align-items: center;
    justify-content: center;

    box-shadow:
        0 6px 20px rgba(79,70,229,0.2),
        inset 0 1px 2px rgba(255,255,255,0.6);
}

.icon svg {
    width: 42px;
    height: 42px;
    color: #4f46e5;
}

/* TITLE */
h1 {
    font-size: 3.2rem;
    font-weight: 700;
    letter-spacing: -0.02em;

    background: linear-gradient(135deg, #6366f1, #4f46e5);
    -webkit-background-clip: text;
    color: transparent;

    margin-bottom: 0.75rem;
}

/* SUBTITLE */
.subtitle {
    font-size: 1.2rem;
    color: rgba(30,41,59,0.7);
    margin-bottom: 2rem;
    border-bottom: 1px solid rgba(255,255,255,0.4);
    padding-bottom: 1.5rem;
}

/* MESSAGE GLASS */
.message {
    background: rgba(255,255,255,0.4);
    backdrop-filter: blur(12px);

    padding: 1.25rem 1.5rem;
    border-radius: 20px;
    margin-bottom: 2rem;

    border: 1px solid rgba(255,255,255,0.5);
}

.message p {
    color: #1e293b;
    font-size: 1.1rem;
    line-height: 1.6;
}

/* CONTACT BUTTON */
.contact-link {
    padding: 0.75rem 1.5rem;
    border-radius: 100px;

    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(10px);

    color: #4f46e5;
    font-weight: 600;
    text-decoration: none;

    border: 1px solid rgba(255,255,255,0.6);

    transition: 0.25s ease;

    box-shadow: 0 4px 12px rgba(79,70,229,0.15);
}

.contact-link:hover {
    background: #4f46e5;
    color: white;
    transform: translateY(-2px);
}

/* BADGE */
.badge {
    display: inline-block;
    margin-top: 1.5rem;

    padding: 0.35rem 0.9rem;
    border-radius: 999px;

    background: rgba(99,102,241,0.15);
    color: #4f46e5;

    font-size: 0.75rem;
    font-weight: 600;
}

/* FOOTER */
.footer-note {
    margin-top: 2rem;
    font-size: 0.85rem;
    color: rgba(100,116,139,0.7);
}

.footer-note span {
    color: #4f46e5;
}
</style>
</head>
<body>
    <div class="card">
        <div class="icon">
            
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">

  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6F5FF"/>
      <stop offset="100%" stop-color="#DDE3FF"/>
    </linearGradient>

    <!-- Glass Overlay Gradient -->
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Lightning Gradient -->
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7C6FF0"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <!-- Blur for Glass -->
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <!-- Soft Inner Shadow -->
    <filter id="innerShadow">
      <feOffset dx="0" dy="2"/>
      <feGaussianBlur stdDeviation="3" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="#000" flood-opacity="0.08"/>
      <feComposite operator="in" in2="inverse"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>

    <!-- Outer Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- Base Rounded Icon -->
  <rect width="64" height="64" rx="18" fill="url(#bg)"/>

  <!-- Frosted Glass Layer -->
  <rect width="64" height="64" rx="18"
        fill="url(#glass)"
        filter="url(#blur)"
        opacity="0.6"/>

  <!-- Top Highlight (iOS shine) -->
  <path d="M0 0 H64 V22 Q32 32 0 22 Z"
        fill="white"
        opacity="0.25"/>

  <!-- Glass Circle Core -->
  <circle cx="32" cy="32" r="22"
          fill="white"
          opacity="0.15"
          stroke="white"
          stroke-opacity="0.25"/>

  <!-- Inner Glow -->
  <circle cx="32" cy="32" r="18"
          fill="#5B4EE8"
          opacity="0.08"/>

  <!-- Lightning Bolt -->
  <path d="M37 8 L17 34 H29 L24 56 L47 28 H34 Z"
        fill="url(#bolt)"
        filter="url(#innerShadow)"/>

  <!-- Glow Effect -->
  <path d="M37 8 L17 34 H29 L24 56 L47 28 H34 Z"
        fill="url(#bolt)"
        opacity="0.3"
        filter="url(#glow)"/>

</svg>
        </div>
        
        <h1>ssc</h1>
        <div class="subtitle">Something big is coming</div>
        
        <div class="message">
            <p>Our ssc platform is under construction.<br>We'll be here soon with a great experience.</p>
        </div>

        <div class="contact">
            <span class="contact-label">Need it faster?</span>
            <br><br>
            <a href="https://t.me/mindmaster_robot" target="_blank" rel="noopener" class="contact-link">
                t.me/mindmaster_robot
            </a>
        </div>

        <div class="badge">
            ✦ LAUNCHING SOON ✦
        </div>
        
        <div class="footer-note">
            <span>commercesehoga</span> — we build with purpose
        </div>
    </div>
</body>
</html>
